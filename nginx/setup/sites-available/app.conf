server {
    listen 80;
    server_name casestudies.sipexchangebc.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name casestudies.sipexchangebc.com;

    ssl_certificate /etc/nginx/ssl/live/casestudies.sipexchangebc.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/casestudies.sipexchangebc.com/privkey.pem;

    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/xml text/css application/json;
    gzip_min_length 1000;

    location / {
        proxy_pass http://app:3838/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 300;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
    }
}
