services:
  app:
    container_name: app
    build: .
    platform: linux/amd64
    ports:
      - "3838:3838"
    volumes:
      - ./app:/srv/shiny-server:ro
    environment:
      - SHINY_LOG_STDERR=1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

